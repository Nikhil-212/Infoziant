# HTTP Nginx configuration for the frontend container.
# This config is baked into the frontend Docker image.
# For production HTTPS, see deploy/nginx/vehiclevault.conf

server {
    listen 80;
    server_name _;

    # Root — Vite production build
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase body size limit for PDF uploads (must match MAX_UPLOAD_SIZE_MB + overhead)
    client_max_body_size 15m;

    # API reverse proxy — forward to backend Express service
    # The hostname 'backend' resolves to the backend container on the Compose network.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts — generous for file uploads
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Do NOT pass API errors through to the React fallback
        proxy_intercept_errors off;
    }

    # React Router SPA fallback — all unknown paths serve index.html
    # IMPORTANT: This only applies to non-/api paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
